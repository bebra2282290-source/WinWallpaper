name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/WinWallpaper.exe dist/WinWallpaper-${{ matrix.arch }}.exe
          Get-Item dist/*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WinWallpaper-${{ matrix.arch }}
          path: dist/WinWallpaper-${{ matrix.arch }}.exe
          if-no-files-found: error

  # Runs the real program on a Windows desktop: sets a test video as the
  # wallpaper, checks that it shows up behind the icons, and that it pauses
  # (no CPU use) while a window covers the desktop.
  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WinWallpaper-x64
          path: dist

      - name: Run smoke test
        shell: powershell
        run: .github/scripts/smoke-test.ps1 -Exe dist/WinWallpaper-x64.exe -OutDir smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ matrix.os }}
          path: smoke
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WinWallpaper-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
